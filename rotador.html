<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableros AngioDynamics — Rotación</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0f2542;font-family:'Segoe UI',system-ui,sans-serif}
  .frame-wrap{position:absolute;inset:0}
  iframe{width:100%;height:100%;border:0;display:none}
  iframe.active{display:block}
  /* barra de progreso arriba que muestra cuanto falta para el cambio */
  .progress{position:fixed;top:0;left:0;height:4px;background:#1f9d55;width:0;z-index:9999;transition:width .5s linear}
  /* indicador de cual dashboard se ve */
  .tag{position:fixed;bottom:12px;right:14px;background:rgba(15,37,66,.85);color:#fff;font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;z-index:9999;letter-spacing:.5px}
  .tag b{color:#7fd1a3}
  /* overlay "toca para iniciar" -- los navegadores no dejan entrar a pantalla
     completa con JS sin que un humano toque la pantalla primero. Este overlay
     se quita solo despues del primer toque/clic. */
  .fs-overlay{position:fixed;inset:0;background:#0f2542;z-index:99999;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;
    color:#fff;font-family:'Segoe UI',system-ui,sans-serif;cursor:pointer}
  .fs-overlay .btn{background:#1f9d55;color:#fff;border:0;border-radius:12px;
    padding:18px 36px;font-size:22px;font-weight:800;cursor:pointer}
  .fs-overlay .hint{font-size:13px;color:#9fb4cf}
  .fs-overlay.hidden{display:none}
</style>
</head>
<body>
  <div class="progress" id="prog"></div>
  <div class="frame-wrap">
    <!-- Dashboard 1: EMBARQUES -->
    <iframe id="f1" class="active" data-src="embarques.html" src="embarques.html?tv"></iframe>
    <!-- Dashboard 2: EMBARQUE / PRODUCCION POR PROCESO -->
    <iframe id="f2" data-src="embarque_produccion.html" src="embarque_produccion.html?tv"></iframe>
  </div>
  <div class="tag" id="tag">Mostrando: <b id="tagname">Hora a Hora</b></div>

  <div class="fs-overlay" id="fsOverlay">
    <button class="btn" id="fsBtn">▶ Iniciar pantalla completa</button>
    <div class="hint">(Si ya usas modo kiosco de Chrome, este mensaje no debería salir)</div>
  </div>

<script>
  // ===== CONFIGURACION =====
  const INTERVALO_MIN = 3;              // cambiar cada 3 minutos
  const RECARGA_PAGINA_HORAS = 1;       // recarga TODA la pagina cada 1 hora
  const dashboards = [
    { id:"f1", nombre:"Hora a Hora" },
    { id:"f2", nombre:"Embarque por Proceso" },
  ];
  // =========================

  const INTERVALO_MS = INTERVALO_MIN * 60 * 1000;
  let actual = 0;

  function mostrar(i){
    dashboards.forEach((d,idx)=>{
      const frame = document.getElementById(d.id);
      frame.classList.toggle("active", idx===i);
      if(idx===i){
        // recarga forzada con datos frescos justo al mostrarlo, en vez de
        // confiar en el auto-refresco interno del tablero (que puede
        // quedarse dormido mientras el iframe estuvo oculto en el fondo)
        const base = frame.dataset.src;
        frame.src = base + "?tv&_=" + Date.now();
      }
    });
    document.getElementById("tagname").textContent = dashboards[i].nombre;
  }

  function siguiente(){
    actual = (actual + 1) % dashboards.length;
    mostrar(actual);
    reiniciarBarra();
  }

  // barra de progreso visual
  let barraInicio;
  function reiniciarBarra(){
    barraInicio = Date.now();
  }
  function animarBarra(){
    const t = (Date.now() - barraInicio) / INTERVALO_MS;
    document.getElementById("prog").style.width = Math.min(t*100,100) + "%";
    requestAnimationFrame(animarBarra);
  }

  // arranque
  mostrar(0);
  reiniciarBarra();
  animarBarra();
  setInterval(siguiente, INTERVALO_MS);

  // Pantalla completa: los navegadores exigen un toque/clic humano antes de
  // dejar entrar a fullscreen por JS. Si ya esta en modo kiosco (--kiosk) o
  // ya en fullscreen, el overlay ni siquiera aparece. Si no, se queda un
  // boton simple que activa fullscreen con el primer toque y desaparece.
  const overlay = document.getElementById("fsOverlay");
  function yaEnPantallaCompleta(){
    return !!(document.fullscreenElement || window.innerHeight === screen.height);
  }
  function activarFullscreen(){
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if(req) req.call(el).catch(()=>{});
    overlay.classList.add("hidden");
  }
  if(yaEnPantallaCompleta()){
    overlay.classList.add("hidden");
  } else {
    overlay.addEventListener("click", activarFullscreen);
    document.getElementById("fsBtn").addEventListener("click", activarFullscreen);
  }

  // RECARGA COMPLETA DE LA PAGINA cada cierto tiempo. Esto es aparte de la
  // recarga de cada iframe al rotar: aqui se recarga rotador.html EN SI
  // MISMO, para que si alguna vez subimos una correccion de codigo (como
  // esta), la TV la recoja sola en menos de 1 hora en vez de quedarse
  // corriendo para siempre el JavaScript viejo que ya tenia cargado en
  // memoria desde que se prendio.
  setTimeout(()=>{ location.reload(); }, RECARGA_PAGINA_HORAS * 60 * 60 * 1000);


</script>
</body>
</html>
